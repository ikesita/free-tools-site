<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複利・積立計算機｜毎月の積立と運用で将来いくらになるか試算</title>
<meta name="description" content="元本・毎月の積立額・年利・運用期間から、複利で将来いくらになるかを試算できる無料ツールです。元本合計と運用益も表示します。">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2333; --sub:#5b6478; --line:#dde1ea; --acc:#0f766e; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
  header h1{font-size:25px;margin:8px 0 4px}
  header p{color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .f input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:6px 0;color:var(--sub)} td.v{text-align:right;color:var(--ink);font-weight:800}
  .note{font-size:13px;color:var(--sub)}
  footer{color:var(--sub);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>複利・積立計算機</h1>
    <p>最初の元本と毎月の積立が、複利で将来いくらになるかを試算します。</p>
  </header>

  <div class="card">
    <div class="grid">
      <div class="f"><label>最初の元本（円）</label><input id="principal" type="number" min="0" step="10000" value="1000000"></div>
      <div class="f"><label>毎月の積立額（円）</label><input id="monthly" type="number" min="0" step="1000" value="30000"></div>
      <div class="f"><label>年利（％）</label><input id="rate" type="number" min="0" step="0.1" value="5"></div>
      <div class="f"><label>運用期間（年）</label><input id="years" type="number" min="0" max="60" step="1" value="20"></div>
    </div>
  </div>

  <div class="card">
    <table>
      <tr><td>将来の金額</td><td class="v" id="fv">-</td></tr>
      <tr><td>拠出した元本の合計</td><td class="v" id="paid">-</td></tr>
      <tr><td>運用益</td><td class="v" id="gain">-</td></tr>
    </table>
    <p class="note" style="margin-top:10px">積立は毎月末に行う前提で、利息は月複利で計算しています。税金・手数料・価格変動は含まない試算であり、将来の成果を保証するものではありません。</p>
  </div>

  <footer>入力内容はブラウザ内でのみ処理され、送信されません。</footer>
</div>

<script>
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
function calc(){
  const P = num(principal.value), M = num(monthly.value), r = num(rate.value) / 100 / 12, n = Math.round(num(years.value) * 12);
  let fvP, fvM;
  if(r === 0){ fvP = P; fvM = M * n; }
  else { const f = Math.pow(1 + r, n); fvP = P * f; fvM = M * (f - 1) / r; }
  const paid = P + M * n;
  fvEl.textContent = yen(fvP + fvM);
  paidEl.textContent = yen(paid);
  gainEl.textContent = yen(fvP + fvM - paid);
}
const principal = document.getElementById("principal"), monthly = document.getElementById("monthly"),
      rate = document.getElementById("rate"), years = document.getElementById("years");
const fvEl = document.getElementById("fv"), paidEl = document.getElementById("paid"), gainEl = document.getElementById("gain");
[principal, monthly, rate, years].forEach(e => e.addEventListener("input", calc));
calc();
</script>

</div>
</body>
</html>
