<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像圧縮ツール｜アップロードなしでJPEG・WebPに圧縮</title>
<meta name="description" content="画像をサーバーにアップロードせず、ブラウザ内だけで圧縮できる無料ツールです。画質と最大サイズを指定して、JPEG／WebPで保存できます。">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2333; --sub:#5b6478; --line:#dde1ea; --acc:#7c3aed; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
  header h1{font-size:25px;margin:8px 0 4px}
  header p{color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:6px 0;color:var(--sub)} td.v{text-align:right;color:var(--ink);font-weight:800}
  button,a.btn{display:inline-block;background:var(--acc);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:15px;cursor:pointer;text-decoration:none}
  img.preview{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:10px}
  .note{font-size:13px;color:var(--sub)}
  footer{color:var(--sub);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>画像圧縮ツール</h1>
    <p>画像はサーバーにアップロードされません。お使いのブラウザの中だけで圧縮処理を行います。</p>
  </header>

  <div class="card">
    <div class="f" style="margin-bottom:12px"><label>画像ファイル（JPEG / PNG / WebP など）</label>
      <input id="file" type="file" accept="image/*"></div>
    <div class="grid">
      <div class="f"><label>画質（1〜100）</label><input id="quality" type="number" min="1" max="100" step="1" value="80"></div>
      <div class="f"><label>最大の幅・高さ（px、0で元サイズ）</label><input id="maxdim" type="number" min="0" step="10" value="1920"></div>
      <div class="f"><label>出力形式</label><select id="format"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div>
    </div>
    <div style="margin-top:14px"><button id="run">圧縮する</button></div>
    <img id="preview" class="preview" alt="" style="display:none">
  </div>

  <div class="card">
    <table>
      <tr><td>元のサイズ</td><td class="v" id="before">-</td></tr>
      <tr><td>圧縮後のサイズ</td><td class="v" id="after">-</td></tr>
      <tr><td>削減率</td><td class="v" id="ratio">-</td></tr>
      <tr><td>出力サイズ（px）</td><td class="v" id="dims">-</td></tr>
    </table>
    <div style="margin-top:12px"><a id="dl" class="btn" style="display:none" download="compressed.jpg">圧縮した画像を保存</a></div>
    <p class="note" style="margin-top:10px">PNGなど透過を持つ画像をJPEGにすると、透過部分は白になります。透過を保ちたい場合はWebPをお選びください。</p>
  </div>

  <footer>選択した画像が外部に送信されることは一切ありません。すべての処理はこのページ内で完結します。</footer>
</div>

<script>
let imgObj = null, fileName = "image";
const kb = b => b >= 1048576 ? (b / 1048576).toFixed(2) + " MB" : (b / 1024).toFixed(1) + " KB";
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  fileName = f.name.replace(/\.[^.]+$/, "");
  document.getElementById("before").textContent = kb(f.size);
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { imgObj = im; const p = document.getElementById("preview"); p.src = url; p.style.display = "block"; };
  im.src = url;
});
document.getElementById("run").addEventListener("click", () => {
  if(!imgObj){ alert("先に画像ファイルを選んでください。"); return; }
  const q = Math.min(100, Math.max(1, parseFloat(document.getElementById("quality").value) || 80)) / 100;
  const maxd = parseFloat(document.getElementById("maxdim").value) || 0;
  let w = imgObj.naturalWidth, h = imgObj.naturalHeight;
  if(maxd > 0 && Math.max(w, h) > maxd){ const r = maxd / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(imgObj, 0, 0, w, h);
  const format = document.getElementById("format").value;
  c.toBlob(blob => {
    document.getElementById("after").textContent = kb(blob.size);
    const beforeText = document.getElementById("before").textContent;
    const url0 = document.getElementById("file").files[0];
    if(url0) document.getElementById("ratio").textContent = "−" + (100 - blob.size / url0.size * 100).toFixed(1) + " ％";
    document.getElementById("dims").textContent = w + " × " + h;
    const dl = document.getElementById("dl");
    dl.href = URL.createObjectURL(blob);
    dl.download = fileName + (format === "image/webp" ? ".webp" : ".jpg");
    dl.style.display = "inline-block";
  }, format, q);
});
</script>
</body>
</html>
