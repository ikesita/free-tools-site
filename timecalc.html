<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時間計算機｜時間の足し算・引き算と、小数時間への変換</title>
<meta name="description" content="「1時間30分＋2時間45分」のような時間の足し算・引き算と、勤務時間の合計、小数時間への変換ができる無料ツールです。">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2333; --sub:#5b6478; --line:#dde1ea; --acc:#7c3aed; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
  header h1{font-size:25px;margin:8px 0 4px}
  header p{color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .card h2{font-size:16px;margin:0 0 12px}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .row input{width:76px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  .row select{padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .ans{font-size:20px;font-weight:800;color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:5px 0;color:var(--sub)} td.v{text-align:right;color:var(--ink);font-weight:800}
  footer{color:var(--sub);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>時間計算機</h1>
    <p>時間の足し算・引き算と、合計時間のいろいろな表し方を計算します。</p>
  </header>

  <div class="card">
    <h2>時間の足し算・引き算</h2>
    <div class="row"><input id="h1" type="number" value="1"><span>時間</span><input id="m1" type="number" value="30"><span>分</span><input id="s1" type="number" value="0"><span>秒</span></div>
    <div class="row"><select id="op"><option value="plus">＋</option><option value="minus">−</option></select></div>
    <div class="row"><input id="h2" type="number" value="2"><span>時間</span><input id="m2" type="number" value="45"><span>分</span><input id="s2" type="number" value="0"><span>秒</span></div>
    <div class="row"><span>＝</span><span class="ans" id="out">-</span></div>
  </div>

  <div class="card">
    <h2>結果の別の表し方</h2>
    <table>
      <tr><td>合計（秒）</td><td class="v" id="tsec">-</td></tr>
      <tr><td>合計（分）</td><td class="v" id="tmin">-</td></tr>
      <tr><td>小数時間（例：給与計算用）</td><td class="v" id="tdec">-</td></tr>
      <tr><td>日数にすると</td><td class="v" id="tday">-</td></tr>
    </table>
  </div>

  <footer>入力内容はブラウザ内でのみ処理され、送信されません。</footer>
</div>

<script>
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const ids = ["h1","m1","s1","h2","m2","s2","op","out","tsec","tmin","tdec","tday"];
const el = {}; ids.forEach(id => el[id] = document.getElementById(id));
function calc(){
  const t1 = num(el.h1.value) * 3600 + num(el.m1.value) * 60 + num(el.s1.value);
  const t2 = num(el.h2.value) * 3600 + num(el.m2.value) * 60 + num(el.s2.value);
  const t = el.op.value === "plus" ? t1 + t2 : t1 - t2;
  const sign = t < 0 ? "−" : "";
  const a = Math.abs(Math.round(t));
  const h = Math.floor(a / 3600), m = Math.floor(a % 3600 / 60), s = a % 60;
  el.out.textContent = sign + h + "時間 " + m + "分 " + s + "秒";
  el.tsec.textContent = Math.round(t).toLocaleString("ja-JP") + " 秒";
  el.tmin.textContent = (Math.round(t / 60 * 100) / 100).toLocaleString("ja-JP") + " 分";
  el.tdec.textContent = (Math.round(t / 3600 * 10000) / 10000).toLocaleString("ja-JP") + " 時間";
  el.tday.textContent = (Math.round(t / 86400 * 10000) / 10000).toLocaleString("ja-JP") + " 日";
}
["h1","m1","s1","h2","m2","s2","op"].forEach(id => el[id].addEventListener("input", calc));
calc();
</script>

</body>
</html>
